name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # brands: geen eigen logo in home-assistant/brands; alleen relevant voor de standaard HACS-store
          ignore: brands
